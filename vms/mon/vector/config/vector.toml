[api]
enabled = true
address = "0.0.0.0:8686"

[sources.agent_docker]
type = "vector"
address = "0.0.0.0:8687"
version = "2"

[sources.agent_syslog]
type = "vector"
address = "0.0.0.0:8688"
version = "2"

[sources.agent_metrics]
type = "vector"
address = "0.0.0.0:8689"
version = "2"

[transforms.drop_docker_labels]
type = "remap"
inputs = ["agent_docker"]
source = '''
del(.label)
del(.container_created_at)
del(.container_id)
del(.host)
'''

[transforms.parse_docker]
type = "remap"
inputs = ["drop_docker_labels"]
source = '''
parsed = parse_json(.message) ?? parse_key_value(.message) ?? {}
if is_object(parsed) {
  . = merge!(., parsed)
}

# Set defaults only for fields that might be missing
if !exists(.level) && !exists(.severity) {
  .level = "info"
} else if exists(.severity) && !exists(.level) {
  .level = .severity
}

if !exists(.hostname) {
  .hostname = get_hostname() ?? "unknown"
}

if !exists(.source_type) {
  .source_type = "docker"
}
'''

[transforms.parse_syslog]
type = "remap"
inputs = ["agent_syslog"]
source = '''
parsed = parse_syslog(.message) ?? {}
if is_object(parsed) {
  . = merge(., parsed)
}

# Set defaults only for missing fields
if !exists(.hostname) {
  .hostname = get_hostname() ?? "unknown"
}

if !exists(.appname) {
  .appname = "unknown"
}
'''

[sinks.loki_docker]
type = "loki"
inputs = [ "parse_docker" ]
endpoint = "http://loki:3100"
encoding.codec = "json"
out_of_order_action = "accept"

[sinks.loki_docker.labels]
forwarder = "vector"
domain = "vms"
level = "{{ level }}"
hostname = "{{ hostname }}"
source_type = "{{ source_type }}"
stream = "{{ stream }}"
container_name = "{{ container_name }}"
image = "{{ image }}"

[sinks.loki_syslog]
type = "loki"
inputs = [ "parse_syslog" ]
endpoint = "http://loki:3100"
encoding.codec = "json"
out_of_order_action = "accept"

[sinks.loki_syslog.labels]
forwarder = "vector"
source_type = 'syslog'
domain = 'vms'
hostname = '{{hostname}}'
appname = '{{appname}}'

[sinks.prom]
type = "prometheus_exporter"
inputs = [ "agent_metrics" ]
address = "0.0.0.0:9598"
flush_period_secs = 60
