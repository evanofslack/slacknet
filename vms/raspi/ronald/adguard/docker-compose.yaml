services:
  adguardhome:
    image: adguard/adguardhome:v0.107.52
    container_name: adguardhome
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /srv/adguard/conf:/opt/adguardhome/conf
      - /srv/adguard/work:/opt/adguardhome/work
    ports:
      # DNS
      - 53:53/tcp
      - 53:53/udp
      # HTTPS
      - 80:80/tcp
      - 443:443/tcp
      - 443:443/udp
      - 3001:3000/tcp
