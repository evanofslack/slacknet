services:
  analogdb-web:
    image: evanofslack/analogdb-web:latest
    container_name: analogdb-web
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      API_BASE_URL: ${API_BASE_URL}

      API_WEB_USERNAME: ${API_WEB_USERNAME}
      API_WEB_PASSWORD: ${API_WEB_PASSWORD}
      API_ADMIN_USERNAME: ${API_ADMIN_USERNAME}
      API_ADMIN_PASSWORD: ${API_ADMIN_PASSWORD}

      # AUTH_USERNAME: ${AUTH_USERNAME}
      # AUTH_PASSWORD: ${AUTH_PASSWORD}

      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SECRET: ${ADMIN_SECRET}
      NODE_BASE_URL: ${NODE_BASE_URL}

      GRAFANA_URL: ${GRAFANA_URL}
      DAGSTER_URL: ${DAGSTER_URL}



networks:
  default:
    external: true
    name: prod
