services:
  backend:
    image: evanofslack/ow2stats-backend
    container_name: ow2stats-backend
    environment:
      OW2STATS_DATABASE_URL: ${OW2STATS_DATABASE_URL}
      OW2STATS_PORT: 3000
      OW2STATS_LOG_LEVEL: "info"
      RUST_LOG: "info"
    ports:
      - "3291:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: ow2stats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ow2stats
      POSTGRES_USER: ow2stats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ow2stats -d ow2stats"]
      interval: 10s
      timeout: 5s
      retries: 5


  scraper:
    image: evanofslack/ow2stats-scrape
    container_name: ow2stats-scrape
    environment:
      OW_BACKEND_URL: "http://backend:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

