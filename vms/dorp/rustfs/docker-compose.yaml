services:
  rustfs:
    image: rustfs/rustfs:1.0.6
    container_name: rustfs
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - 9010:9000 # S3 API, gateway caddy: rustfs.local
      - 9011:9001 # console, gateway caddy: rustfs-console.local
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    # named volumes: docker seeds them with the image's /data and /logs ownership
    # (uid 10001), a bind mount would need a chown on the host first
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  rustfs_data:
  rustfs_logs:
