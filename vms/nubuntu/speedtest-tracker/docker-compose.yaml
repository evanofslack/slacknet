version: '3.3'
services:
  speedtest-tracker:
    image: ghcr.io/alexjustesen/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    ports:
      - 8173:80
    environment:
      - PUID=1000
      - PGID=1000
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=speedtest_tracker
      - DB_USERNAME=speedy
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_KEY=${APP_KEY}
    volumes:
      - /srv/speedtest-tracker/config:/config
    depends_on:
      - db
  db:
    image: postgres:15
    restart: unless-stopped
    container_name: speedtest-tracker-postgres
    environment:
      - POSTGRES_DB=speedtest_tracker
      - POSTGRES_USER=speedy
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /srv/speedtest-tracker/postgres:/var/lib/postgresql/data
