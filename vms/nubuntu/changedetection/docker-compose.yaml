services:
    changedetection:
      image: ghcr.io/dgtlmoon/changedetection.io:latest
      container_name: changedetection
      hostname: changedetection
      restart: unless-stopped
      volumes:
        - /srv/changedetection/data:/datastore
        - /srv/changedetection/proxies.json:/datastore/proxies.json
      environment:
        - PORT=5000
        - PUID=1000
        - PGID=1000
        - PLAYWRIGHT_DRIVER_URL=ws://playwright-chrome:3000/?stealth=1&--disable-web-security=true
        - BASE_URL=https://change.local.eslack.net
        - WEBDRIVER_URL=http://browser-chrome:4444/wd/hub
      ports:
        - 5000:5000
      depends_on:
        browser-chrome:
            condition: service_started
        playwright-chrome:
            condition: service_started

    browser-chrome:
        container_name: changedetection-chrome
        hostname: browser-chrome
        image: selenium/standalone-chrome-debug:3.141.59
        restart: unless-stopped
        environment:
            - VNC_NO_PASSWORD=1
            - SCREEN_WIDTH=1920
            - SCREEN_HEIGHT=1080
            - SCREEN_DEPTH=24
        volumes:
            - /srv/changedetection/browser/dev/shm:/dev/shm

    playwright-chrome:
        container_name: changedetection-playwright
        hostname: playwright-chrome
        image: browserless/chrome
        restart: unless-stopped
        environment:
            - SCREEN_WIDTH=1920
            - SCREEN_HEIGHT=1024
            - SCREEN_DEPTH=16
            - ENABLE_DEBUGGER=false
            - PREBOOT_CHROME=true
            - CONNECTION_TIMEOUT=300000
            - MAX_CONCURRENT_SESSIONS=10
            - CHROME_REFRESH_TIME=600000
            - DEFAULT_BLOCK_ADS=true
            - DEFAULT_STEALTH=true
