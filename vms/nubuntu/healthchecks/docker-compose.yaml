version: "3.7"
services:
  healthchecks:
    image: lscr.io/linuxserver/healthchecks:latest
    container_name: healthchecks
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SITE_ROOT=https://healthchecks.local.eslack.net
      - SITE_NAME=Slacknet Healthchecks
      - DEFAULT_FROM_EMAIL=healthchecks@slacknet.com
      - EMAIL_HOST=
      - EMAIL_PORT=
      - EMAIL_HOST_USER=
      - EMAIL_HOST_PASSWORD=
      - EMAIL_USE_TLS=
      - SUPERUSER_EMAIL=evanhslack@gmail.com
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
      - REGENERATE_SETTINGS= #optional
      - ALLOWED_HOSTS= #optional
      - APPRISE_ENABLED=True
      - DEBUG=False
      - INTEGRATIONS_ALLOW_PRIVATE_IPS= #optional
      - PING_EMAIL_DOMAIN= #optional
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./data:/config
    ports:
      - 8055:8000
        # - 2525:2525 #optional
