# hohm config for nubuntu (https://github.com/evanofslack/hohm)
# Catalog mirrors docs/network/flame-dashboard.md. Validate with:
#   docker run --rm -v ./data:/data evanofslack/hohm validate -f /data/config.yaml

settings:
  title: slacknet
  greeting: {enabled: true, name: Evan}
  date: {enabled: true}
  theme: {light: gazette, dark: tron}
  newTab: false
  history: 10

search:
  default: d
  providers:
    - {token: g, name: Google, url: "https://www.google.com", search: "https://www.google.com/search?q={query}"}
    - {token: d, name: DuckDuckGo, url: "https://duckduckgo.com", search: "https://duckduckgo.com/?q={query}"}
    - {token: y, name: YouTube, url: "https://www.youtube.com", search: "https://www.youtube.com/results?search_query={query}"}
    - {token: gh, name: GitHub, url: "https://github.com", search: "https://github.com/search?q={query}"}
    - {token: git, name: Gitea, url: "https://git.local.eslack.net", search: "https://git.local.eslack.net/explore/repos?q={query}"}

groups:
