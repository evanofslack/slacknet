receivers:
  otlp:
    protocols:
      grpc: # OTLP gRPC receiver
        endpoint: 0.0.0.0:4317
      http: # OTLP HTTP receiver
        endpoint: 0.0.0.0:4318

processors:
  batch: # Batch processor to improve throughput
    timeout: 5s
    send_batch_size: 10
    metadata_cardinality_limit: 1000

exporters:
  prometheus: # Prometheus exporter for metrics data
    endpoint: "0.0.0.0:8889"  # Prometheus scraping endpoint
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1888
  zpages:
    endpoint: 0.0.0.0:55679
service:
  extensions: [ health_check, pprof, zpages ]  # Enable extension
  pipelines:
    metrics:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ prometheus ]
  telemetry:
    logs:
      level: "info"  # Collector log level
      encoding: "json"  # Log encoding: console or json
    metrics:
      level: "basic" # Can be basic, normal, detailed
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://otel-collector:4318
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
