version: "3.8"

services:
    web:
        image: docker.cloudsmith.io/convoy/convoy/frain-dev/convoy:v23.06.3
        container_name: convoy-web
        restart: unless-stopped
        command: ["/start.sh"]
        volumes:
            - ./convoy.json:/convoy.json
        ports:
          - 5005:5005
        depends_on:
            - postgres
            - redis_server
            - typesense

    scheduler:
        image: docker.cloudsmith.io/convoy/convoy/frain-dev/convoy:v23.06.3
        container_name: convoy-scheduler
        restart: unless-stopped
        command: ["./cmd", "scheduler", "--config", "convoy.json"]
        volumes:
            - ./convoy.json:/convoy.json
        depends_on:
            - postgres
            - redis_server
            - typesense

    worker:
        image: docker.cloudsmith.io/convoy/convoy/frain-dev/convoy:v23.06.3
        container_name: convoy-worker
        restart: unless-stopped
        command: ["./cmd", "worker", "--config", "convoy.json"]
        volumes:
            - ./convoy.json:/convoy.json
        depends_on:
            - postgres
            - redis_server
            - typesense

    stream:
        image: docker.cloudsmith.io/convoy/convoy/frain-dev/convoy:v23.06.3
        container_name: convoy-stream
        restart: unless-stopped
        command: ["./cmd", "stream", "--config", "convoy.json"]
        volumes:
            - ./convoy.json:/convoy.json
        depends_on:
            - postgres
            - redis_server

    ingest:
      image: docker.cloudsmith.io/convoy/convoy/frain-dev/convoy:v23.06.3
      container_name: convoy-ingest
      restart: unless-stopped
      command: ["./cmd", "ingest", "--config", "convoy.json"]
      volumes:
        - ./convoy.json:/convoy.json
      restart: on-failure
      depends_on:
        - postgres
        - redis_server
        - typesense

    postgres:
      image: postgres:15.2-alpine
      restart: unless-stopped
        #container_name: convoy-postgres
      environment:
        POSTGRES_DB: convoy
        POSTGRES_USER: convoy
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        PGDATA: /data/postgres
      volumes:
        - ./postgres_data:/data/postgres

    redis_server:
        image: redis:alpine
        container_name: convoy-redis
        restart: unless-stopped
        volumes:
          - ./redis_data:/data

    typesense:
        image: typesense/typesense:0.24.0
        container_name: convoy-typesense
        restart: unless-stopped
        environment:
            TYPESENSE_DATA_DIR: /data/typesense
            TYPESENSE_ENABLE_CORS: "true"
            TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
        volumes:
            - ./typesense_data:/data/typesense

