games:
  - type: trivia
    questions:
      - text: "Which grape variety is used to make Champagne?"
        options: ["Chardonnay only", "Pinot Noir only", "Both Chardonnay and Pinot Noir", "Sauvignon Blanc"]
        answer: "Both Chardonnay and Pinot Noir"
        points: 3
      - text: "What country produces Malbec most famously?"
        options: ["France", "Italy", "Spain", "Argentina"]
        answer: "Argentina"
        points: 2
      - text: "Which region in France is known for Cabernet Sauvignon?"
        options: ["Burgundy", "Bordeaux", "Champagne", "Alsace"]
        answer: "Bordeaux"
        points: 2

