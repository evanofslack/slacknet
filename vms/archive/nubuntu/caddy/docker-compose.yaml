version: "3.9"

services:
  caddy:
    image: iarekylew00t/caddy-cloudflare:2.7
    container_name: caddy
      #command: /usr/bin/caddy run --resume
    restart: "no"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "2019:2019" # admin
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - CF_API_TOKEN=${CF_API_TOKEN}
      - NUBUNTU_ADDR=${NUBUNTU_ADDR}
      - KUBUNTU_ADDR=${KUBUNTU_ADDR}
      - PBS_ADDR=${PBS_ADDR}
      - TORRR_ADDR=${TORRR_ADDR}
      - MON_ADDR=${MON_ADDR}
      - SCALE_ADDR=${SCALE_ADDR}
      - PVENAVI_ADDR=${PVENAVI_ADDR}
      - GATEWAY_ADDR=${GATEWAY_ADDR}
      - VED_ADDR=${VED_ADDR}
      - PIKVM_ADDR=${PIKVM_ADDR}
      - RALPH_ADDR=${RALPH_ADDR}
      - RONALD_ADDR=${RONALD_ADDR}
      - JOULE_ADDR=${JOULE_ADDR}

  caddy-ui:
    image: qmcgaw/caddy-ui
    container_name: caddy-ui
    restart: "no"
    ports:
      - 8443:8000/tcp
    environment:
      - CADDY_API_ENDPOINT=http://caddy:2019

  caddy-dns-sync:
    image: evanofslack/caddy-dns-sync
    container_name: caddy-dns-sync
    restart: "no"
    ports:
      - "8731:8080" # only exposes metrics
    environment:
      - CADDY_DNS_SYNC_CLOUDFLARE_TOKEN=${CF_API_TOKEN}
      - CADDY_DNS_SYNC_CADDY_URL=http://caddy:2019
      - CADDY_DNS_SYNC_ZONES=eslack.net
      - CADDY_DNS_SYNC_DRYRUN=true #
    volumes:
      - caddy_dns_sync_state:/data

volumes:
  caddy_data:
  caddy_config:
  caddy_dns_sync_state:
