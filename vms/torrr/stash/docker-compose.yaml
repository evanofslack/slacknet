services:
  stash:
    image: stashapp/stash:latest
    container_name: stash
    restart: unless-stopped
    ports:
      - 9999:9999
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "2m"
    environment:
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      - STASH_PORT=9999
    volumes:
      - /mnt/media/nsfw:/data
      - /etc/localtime:/etc/localtime:ro
      - ./config:/root/.stash
      - ./metadata:/metadata
      - ./cache:/cache
      - ./generated:/generated
