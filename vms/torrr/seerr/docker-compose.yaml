services:
    jellyseerr:
       image: ghcr.io/seerr-team/seerr:latest
       init: true
       container_name: jellyseerr
       environment:
         - LOG_LEVEL=info
         - TZ=America/New_York
       ports:
         - 5055:5055
       volumes:
         - ./data:/app/config
       restart: unless-stopped
