version: "3.7"

services:
  whisparr:
    container_name: whisparr
    restart: unless-stopped
    image: cr.hotio.dev/hotio/whisparr:latest
    ports:
      - 6969:6969
    environment:
      - PUID=1000
      - PGID=1000
        # - UMASK=002
      - TZ=America/New_York
    volumes:
      - ./config:/config
      - /mnt/data:/data
